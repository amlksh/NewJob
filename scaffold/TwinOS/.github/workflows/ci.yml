name: ci
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  contracts-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      # Interface Specification v1.0 강제 지점 (10 문서 §3.3):
      # 스키마 메타검증 + golden examples + manifest/workflow/gate 실물 검증
      - name: Contract schema validation
        run: pytest tests/contracts -v
      - name: Unit tests
        run: pytest tests plugins -v
