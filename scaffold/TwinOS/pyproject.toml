[project]
name = "twinos"
version = "0.1.0"
description = "TwinOS - AI 기반 Digital Twin Operating System (DTOS)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "jsonschema>=4.21",
  "referencing>=0.35",
  "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# 모노레포 flat-layout: 패키지 자동 탐색 비활성화.
# 실행은 pytest pythonpath로 해결하므로 설치 대상 패키지는 없다 (deps 설치 목적의 -e 설치).
packages = []

[tool.pytest.ini_options]
pythonpath = [".", "sdk"]
testpaths = ["tests", "plugins"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
