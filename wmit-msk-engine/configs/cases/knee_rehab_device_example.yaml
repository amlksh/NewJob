# 무릎 재활 보조기 착용 해석 — P1 Reference Use Case
#
# 인체만 해석하는 Case(kneeloads_example.yaml)와 같은 입력에 device 한 줄을
# 더한 것이다. 같은 동작을 장치 착용/미착용으로 돌려 비교하는 것이
# 이 과제의 기본 사용법이다.
#
# 실행:
#   python scripts/run_poc.py --case configs/cases/knee_rehab_device_example.yaml
#
# ⚠ data/ 아래 실제 파일과 models/ 아래 모델을 받아 경로·마커명을 맞춰야 돌아간다.
#    장치 수치도 CAD 값으로 교체해야 한다 (configs/devices/*.yaml 참조).

name: knee_rehab_device_poc

subject:
  height_m: 1.72            # TODO: 실제 피험자 값으로 교체
  mass_kg: 68.0             # TODO: 실제 피험자 값으로 교체
  marker_file: ../../data/kneeloads/gait_trial.trc
  grf_file: ../../data/kneeloads/gait_trial_grf.mot
  static_trial: ../../data/kneeloads/static.trc

model_file: ../../models/rajagopal/Rajagopal2015.osim

# 결합할 의료기기. 스케일링 다음, IK 앞에서 붙는다 —
# 장치 치수는 CAD 로 고정되어 있어 피험자에 맞춰 늘리면 안 된다.
device: ../devices/knee_rehab_brace_example.yaml

templates:
  scale: ../templates/scale_setup.xml
  ik: ../templates/ik_setup.xml
  id: ../templates/id_setup.xml
  so: ../templates/so_setup.xml
  jr: ../templates/jr_setup.xml
  external_loads: ../templates/external_loads.xml

# 해석 구간 [시작, 끝] (초). 생략하면 마커 파일 전체 구간을 쓴다.
# time_range: [0.5, 2.0]

# 관절반력 표현 좌표계. FE 연계 기준이므로 바꾸려면 ADR 을 남길 것.
joint_reaction_frame: tibia_r

joint_reaction_joints:
  - knee_r

# 모델이 요구하는 마커. 입력 TRC 에 없으면 해석을 시작하지 않는다.
# TODO: 실제 모델 마커셋에 맞춰 채울 것.
required_markers: []

# 품질 판정 임계값. ADR-0003 확정 전까지 TBD.
thresholds:
  marker_rms_m: TBD
  marker_max_m: TBD
  residual_force_n: TBD
  residual_moment_nm: TBD

notes: >
  장치 착용 효과를 보려면 이 Case 와 device 항목만 뺀 Case 를 같은 입력으로
  돌려 results/summary.json 의 muscle_forces·joint_reactions 를 비교한다.
  비교 결과를 인용할 때는 두 실행의 provenance.json 을 함께 제시할 것.
