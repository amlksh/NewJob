# ============================================================================
#  WMIT MSK 해석 — 의료기기 파라미터 회신 템플릿
#
#  채우는 방법
#    - 밑줄 `_` 이 채워 넣을 칸입니다. `_` 를 값으로 바꿔주십시오.
#      `_` 가 남아 있으면 해석 엔진이 그 항목을 "미기입" 으로 보고 멈춥니다.
#    - 값만 채우고 **항목 이름(왼쪽 키)은 바꾸지 마십시오.** 이름이 다르면
#      해석 엔진이 파일을 거절합니다.
#    - 모르는 값을 0 이나 임의의 수로 채우지 마십시오. 빈칸으로 두고
#      회신서에 "미정" 이라고 적어주시면 됩니다. 임의의 값은 해석 결과를
#      조용히 틀리게 만듭니다.
#    - 단위는 각 줄 주석에 있습니다. CAD 가 mm 이면 **m 로 변환**해서
#      적어주십시오. 엔진은 단위를 추정하지 않습니다.
#
#  [VPK] 표시가 있는 칸은 비워두십시오 — VPK 가 인체 모델을 붙일 때 채웁니다.
#
#  스키마 설명: docs/interfaces/cad_device_parameters.md
#  요청 배경·회신 시점: 같은 폴더의 README.md
# ============================================================================

# 기기 식별자. 영문·숫자·밑줄 (파일 이름으로도 쓰입니다)
name: _

# 기기에 대한 한 줄 설명
description: _

# ---------------------------------------------------------------------------
# 출처 — 어느 CAD 산출물에서 나온 값인지
#
#   revision 이 비어 있거나 TBD 이면, 이 값으로 낸 해석 결과는 자동으로
#   "인용 불가(citable: false)" 로 표시되어 대외 보고·납품에 쓸 수 없습니다.
#   반드시 실제 리비전을 적어주십시오.
# ---------------------------------------------------------------------------
source:
  cad_file: _              # 예: brace_assembly_revB.step
  revision: _              # 예: revB   ← TBD 로 회신되면 결과를 인용할 수 없습니다
  exported_by: _           # 담당자명
  exported_at: _           # YYYY-MM-DD
  notes: _                 # 특이사항 (예: 최대 토크가 연속 정격인지 최대 정격인지)

# ---------------------------------------------------------------------------
# 기기 강체 — 인체 분절에 붙는 부품
#
#   질량과 관성은 해석 결과를 직접 바꿉니다. 기기를 달면 하지 관성이 늘어
#   관절 모멘트가 달라지므로, 0 으로 두면 "기기 없음" 과 구분되지 않습니다.
#
#   관성은 **질량중심 기준** 값입니다. CAD 가 조립체 원점 기준으로 뽑아주면
#   평행축 정리로 옮겨서 적어주십시오. 어느 기준인지 notes 에 적어주시면
#   저희가 확인하겠습니다.
# ---------------------------------------------------------------------------
segments:

  - name: thigh_cuff                 # 대퇴 커프 — 이름은 바꾸셔도 됩니다
    mass_kg: _                         # kg, 필수. 0 은 거절됩니다
    center_of_mass: [_, _, _]          # m, 세그먼트 좌표계 기준 [x, y, z]
    inertia: [_, _, _, _, _, _]           # kg·m^2, 질량중심 기준
                                     #   [Ixx, Iyy, Izz, Ixy, Ixz, Iyz]
    attachment:
      host_body: femur_r             # [VPK] 인체 모델 body 이름 — 그대로 두십시오
      location: [_, _, _]              # [VPK] 모델 좌표계 값. 비워두십시오.
                                     #   기기 측은 README 의 "부착 위치 회신표" 에
                                     #   해부 랜드마크 기준으로 적어주십시오
      orientation_deg: [_, _, _]       # [VPK]

  - name: shank_cuff                 # 하퇴 커프
    mass_kg: _                         # kg, 필수
    center_of_mass: [_, _, _]          # m
    inertia: [_, _, _, _, _, _]           # kg·m^2
    attachment:
      host_body: tibia_r             # [VPK]
      location: [_, _, _]              # [VPK]
      orientation_deg: [_, _, _]       # [VPK]

  # 힌지 하우징·프레임 등 질량이 있는 부품이 더 있으면 같은 형식으로
  # 추가하십시오. 질량이 무시할 수준이면 빼셔도 됩니다 (그 사실을 notes 에).
  - name: hinge_assembly
    mass_kg: _                         # kg
    center_of_mass: [_, _, _]          # m
    inertia: [_, _, _, _, _, _]           # kg·m^2
    attachment:
      host_body: femur_r             # [VPK]
      location: [_, _, _]              # [VPK]
      orientation_deg: [_, _, _]       # [VPK]

# ---------------------------------------------------------------------------
# 힌지 축
#
#   현재 결합 방식(Tier 1)에서 이 축은 새 자유도를 만들지 않습니다.
#   인체 무릎 축과 **얼마나 어긋났는지 점검**하는 데 씁니다. 허용 오차를
#   넘으면 그 사실이 해석 결과에 경고로 남습니다.
#
#   axis 는 단위법선이며 영벡터는 거절됩니다.
#   **어느 좌표계 기준인지 반드시 expressed_in 또는 notes 에 밝혀주십시오.**
# ---------------------------------------------------------------------------
hinge:
  axis: [_, _, _]                      # 단위법선 [x, y, z]
  expressed_in: femur_r              # [VPK] 기준 좌표계
  location: [_, _, _]                  # [VPK] m
  alignment_tolerance_deg: 10.0      # 허용 어긋남. 기기 측 기준이 있으면 바꿔주십시오

# ---------------------------------------------------------------------------
# 가동범위 — 기기 스토퍼가 물리적으로 허용하는 범위
#
#   환자 처방 ROM 이 아니라 **기기 자체의 한계**입니다. 둘이 다르면
#   기기 값을 적고, 처방 범위는 notes 에 따로 적어주십시오.
#
#   강성은 스토퍼의 실제 특성에서 와야 합니다. 0 은 거절됩니다
#   (아무것도 막지 못하는 스토퍼가 되므로).
# ---------------------------------------------------------------------------
rom:
  coordinate: knee_angle_r           # [VPK] 인체 모델 좌표 이름
  min_deg: _                           # deg, 신전 한계
  max_deg: _                           # deg, 굴곡 한계
  stiffness_nm_per_deg: _              # N·m/deg, 필수. 0 은 거절됩니다
  damping_nm_s_per_deg: _              # N·m·s/deg, 없으면 0
  transition_deg: 2.0                # 스토퍼가 걸리기 시작하는 완충 구간

# ---------------------------------------------------------------------------
# 구동 조건
#
#   mode 를 아래 넷 중 하나로 적어주십시오.
#
#     none               구동 없음. 질량·관성·ROM 만 반영되는 수동 보조기
#     assistive          최대 토크 한도 안에서 보조. 해석이 "이 동작을 도우려면
#                        몇 N·m 가 필요한가" 를 풉니다 → max_torque_nm 필수
#     prescribed_torque  시간에 따른 토크가 이미 정해져 있음 → torque_file 필수
#     passive            스프링·댐퍼 → stiffness_nm_per_rad 필수
#
#   ※ CPM 처럼 관절각을 강제로 끌고 가는 모드(prescribed_motion)는
#     **현재 엔진이 거절합니다.** 해당되면 여기에 적지 마시고 README 의
#     "별도로 회신할 항목" 에 표시해주십시오. 범위 변경 사유가 됩니다.
#
#   강성 단위가 ROM 은 /deg, passive 는 /rad 로 다릅니다. OpenSim 쪽
#   규약이며, 항목 이름에 단위를 박아두었으니 이름대로 적어주십시오.
# ---------------------------------------------------------------------------
actuation:
  mode: _                              # none | assistive | prescribed_torque | passive
  coordinate: knee_angle_r           # [VPK]
  max_torque_nm: _                     # N·m — assistive 일 때 필수
  torque_file: _                       # prescribed_torque 일 때. time, torque 두 열의 CSV/STO
  stiffness_nm_per_rad: _              # N·m/rad — passive 일 때 필수. 0 은 거절
  damping_nm_s_per_rad: _              # N·m·s/rad — passive 일 때 선택
  rest_angle_deg: 0.0                # deg — passive 일 때 스프링 중립 각도
